name: Release

# Pushing a version tag cuts a release. Nothing else triggers this.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary target and the only platform where filename
        # ordering uses Explorer's own StrCmpLogicalW; Linux exercises the
        # natural-sort fallback.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Pinned exactly: setup-uv publishes no floating major tag past v7,
        # and v10 is the current release.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv sync
      - run: uv run pytest -q
      - run: uv run mypy .

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so release notes can diff against the previous tag

      - name: Install uv
        # Pinned exactly: setup-uv publishes no floating major tag past v7,
        # and v10 is the current release.
        uses: astral-sh/setup-uv@v10.0.1

      - name: Check the tag matches the project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python3 -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in pyproject.toml ($version). Bump the version, commit, then re-tag." >&2
            exit 1
          fi

      - name: Build the wheel and sdist
        run: uv build

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag like v1.0.0-rc1 is published as a pre-release.
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
            *) prerelease="" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            $prerelease \
            dist/*
